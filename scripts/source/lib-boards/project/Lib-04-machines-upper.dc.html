<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Machines: upper body</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0C66E4}a:hover{color:#0055CC}
</style>
</helmet>
<div style="width: 1440px; height: 660px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: #FFFFFF; color: #172B4D; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #DCDFE4;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #626F86;">Isometric library</span>
<h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600;">Machines: upper body</h1>
</div>
<span style="font-size: 13px; line-height: 20px; color: #626F86;">{{count}} items · 30° isometric SVG</span>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="height: 200px; box-sizing: border-box; padding: 16px; border-radius: 12px; background: #F7F8F9;"><img src="{{item.src}}" alt="{{item.alt}}" loading="lazy" style="width: 100%; height: 100%; object-fit: contain; display: block;"></div>
<div style="display: flex; flex-direction: column;"><span style="font-size: 13px; line-height: 20px; font-weight: 600;">{{item.name}}</span><span style="font-size: 11px; line-height: 16px; color: #626F86; font-family: ui-monospace, Menlo, monospace;">{{item.file}}</span></div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    // Upload a new SVG to this canvas first, then add it here with its /_blob/ url.
    const items = [
      { name: "Chest press machine", file: 'chest-press.svg', src: '/_blob/4a159f713fbce02b752ec4be639ffced', alt: "Seated chest press machine" },
      { name: "Pec deck / rear delt fly", file: 'pec-deck.svg', src: '/_blob/2788b117e7981a5548c2fb83d7c7ef25', alt: "Pec deck / rear delt fly machine" },
      { name: "Shoulder press machine", file: 'shoulder-press.svg', src: '/_blob/e036656f7a57bbd021ad4e62bee8a9ce', alt: "Seated shoulder press machine" },
      { name: "Lateral raise machine", file: 'lateral-raise-machine.svg', src: '/_blob/68c69b7352a34688e8c956e4e3bfc55d', alt: "Lateral raise machine" },
      { name: "Assisted pull-up / dip machine", file: 'assisted-pull-up.svg', src: '/_blob/8c4bcfc327f7c6c2e928ecfc4d7e86fa', alt: "Assisted pull-up and dip machine" },
      { name: "Seated row / high row machine", file: 'seated-row-machine.svg', src: '/_blob/4219e428bad5619911a7a66bdb501874', alt: "Seated row machine with chest pad" },
      { name: "T-bar / chest-supported row", file: 't-bar-row.svg', src: '/_blob/a755184a00a7bf2431be2378475a1326', alt: "Chest-supported T-bar row" },
      { name: "Pullover machine", file: 'pullover-machine.svg', src: '/_blob/7ba227149c5a4d0263ffb758994e1dc3', alt: "Pullover machine" },
      { name: "Biceps curl machine", file: 'biceps-curl-machine.svg', src: '/_blob/12847dd66766daf870be9ad2d17f4868', alt: "Biceps curl machine" },
      { name: "Triceps extension / seated dip machine", file: 'triceps-machine.svg', src: '/_blob/db38d984449d55340392a259f98b6616', alt: "Triceps extension / seated dip machine" }
    ];
    return { items: items, count: items.length };
  }
}
</script>
</body>
</html>
