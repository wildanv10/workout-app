<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cable machines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0C66E4}a:hover{color:#0055CC}
</style>
</helmet>
<div style="width: 1440px; height: 400px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: #FFFFFF; color: #172B4D; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #DCDFE4;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #626F86;">Isometric library</span>
<h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600;">Cable machines</h1>
</div>
<span style="font-size: 13px; line-height: 20px; color: #626F86;">{{count}} items · 30° isometric SVG</span>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="height: 200px; box-sizing: border-box; padding: 16px; border-radius: 12px; background: #F7F8F9;"><img src="{{item.src}}" alt="{{item.alt}}" loading="lazy" style="width: 100%; height: 100%; object-fit: contain; display: block;"></div>
<div style="display: flex; flex-direction: column;"><span style="font-size: 13px; line-height: 20px; font-weight: 600;">{{item.name}}</span><span style="font-size: 11px; line-height: 16px; color: #626F86; font-family: ui-monospace, Menlo, monospace;">{{item.file}}</span></div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    // Upload a new SVG to this canvas first, then add it here with its /_blob/ url.
    const items = [
      { name: "Functional trainer", file: 'functional-trainer.svg', src: '/_blob/85c7b3de310fbacd01803d5ee1ad5ba1', alt: "Functional trainer with dual adjustable pulleys" },
      { name: "Cable crossover station", file: 'cable-crossover.svg', src: '/_blob/e58385085087e47bd278d3349e11deb1', alt: "Cable crossover with two weight stacks" },
      { name: "Lat pulldown", file: 'lat-pulldown.svg', src: '/_blob/36e358c28d1624b9a5d925ee2741156f', alt: "Lat pulldown machine with weight stack" },
      { name: "Seated cable row", file: 'seated-cable-row.svg', src: '/_blob/4b936853e130afacd7837c721d926c65', alt: "Seated cable row" },
      { name: "Cable attachments", file: 'cable-attachments.svg', src: '/_blob/598446bce9ffcc19fe6eae8527eb63bf', alt: "Cable attachments: straight bar, rope, V-bar and D-handles" }
    ];
    return { items: items, count: items.length };
  }
}
</script>
</body>
</html>
