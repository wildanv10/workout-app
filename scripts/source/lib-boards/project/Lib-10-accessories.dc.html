<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accessories &amp; facility</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0C66E4}a:hover{color:#0055CC}
</style>
</helmet>
<div style="width: 1440px; height: 660px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; background: #FFFFFF; color: #172B4D; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid #DCDFE4;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #626F86;">Isometric library</span>
<h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600;">Accessories &amp; facility</h1>
</div>
<span style="font-size: 13px; line-height: 20px; color: #626F86;">{{count}} items · 30° isometric SVG</span>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="height: 200px; box-sizing: border-box; padding: 16px; border-radius: 12px; background: #F7F8F9;"><img src="{{item.src}}" alt="{{item.alt}}" loading="lazy" style="width: 100%; height: 100%; object-fit: contain; display: block;"></div>
<div style="display: flex; flex-direction: column;"><span style="font-size: 13px; line-height: 20px; font-weight: 600;">{{item.name}}</span><span style="font-size: 11px; line-height: 16px; color: #626F86; font-family: ui-monospace, Menlo, monospace;">{{item.file}}</span></div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    // Upload a new SVG to this canvas first, then add it here with its /_blob/ url.
    const items = [
      { name: "Lifting belt", file: 'lifting-belt.svg', src: '/_blob/4107485e59c87f2ae70014904c9e742b', alt: "Lifting belt" },
      { name: "Dip / weight belt", file: 'dip-belt.svg', src: '/_blob/bb4644d10c1cb6f6406aa0c98834dae1', alt: "Dip belt with chain and plate" },
      { name: "Chalk", file: 'chalk.svg', src: '/_blob/975074a744dfc8ab8abcf131bdedb448', alt: "Chalk bowl on a stand with a chalk bag" },
      { name: "Rubber flooring", file: 'rubber-flooring.svg', src: '/_blob/d07095ea1f8731d460e40aeb7f366de6', alt: "Stack of rubber floor tiles" },
      { name: "Deadlift platform", file: 'deadlift-platform.svg', src: '/_blob/b73c01cff7780d51e88c9f5b8f589068', alt: "Deadlift platform with loaded barbell" },
      { name: "Mirrors", file: 'mirrors.svg', src: '/_blob/25e194bd2af997e4f9221474903b00fd', alt: "Wall mirror panels" },
      { name: "Interval timer / gym clock", file: 'gym-clock.svg', src: '/_blob/ddc9b27caf162a1271d5e874af1b9e84', alt: "Interval timer / gym clock" },
      { name: "Body composition analyzer", file: 'body-composition-analyzer.svg', src: '/_blob/92709d16b121e71d8842a25f6cf0dd1f', alt: "Body composition analyzer" }
    ];
    return { items: items, count: items.length };
  }
}
</script>
</body>
</html>
